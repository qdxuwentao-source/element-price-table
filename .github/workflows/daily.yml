name: 每日价格更新

on:
  schedule:
    # 北京时间 08:15 与 20:15（UTC 00:15 与 12:15）
    - cron: '15 0,12 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-price-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build（获取实时价格并重新生成页面）
        run: node src/build.mjs

      - name: 提交并推送变更
        run: |
          git config user.name "price-bot"
          git config user.email "price-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "无价格变化，跳过提交"
          else
            git commit -m "chore: 每日价格更新 $(date -u +%Y-%m-%d)"
            git push
          fi
